    <path d="M178 508C232 494 296 502 346 530"/>
    <path d="M178 532C232 518 296 526 340 552"/>
    <path d="M178 556C232 542 290 550 328 572"/>
    <path d="M178 580C226 568 268 574 300 590"/>
    <path d="M562 484C508 470 444 478 394 506"/>
    <path d="M562 508C508 494 444 502 394 530"/>
    <path d="M562 532C508 518 444 526 400 552"/>
    <path d="M562 556C508 542 450 550 412 572"/>
    <path d="M562 580C514 568 472 574 440 590"/>
