    <rect x="232" y="366" width="28" height="108" rx="4" fill="#3f86b4"/>
    <rect x="428" y="372" width="28" height="102" rx="4" fill="#b0d1a4"/>
    <rect x="464" y="358" width="28" height="116" rx="4" fill="#e6c26a"/>
