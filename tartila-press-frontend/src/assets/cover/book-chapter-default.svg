  <!-- Ranting tumbuh dari punggung buku -->
  <path d="M370 478C364 428 384 378 374 322" fill="none" stroke="#8fb88a" stroke-width="4" stroke-linecap="round"/>
  <g>
    <use href="#leaf" transform="translate(367 452) rotate(-28) scale(1.5)" fill="#b0d1a4"/>
    <use href="#leaf" transform="translate(367 428) rotate(206) scale(1.4)" fill="#8fb88a"/>
    <use href="#leaf" transform="translate(372 402) rotate(-38) scale(1.55)" fill="#b0d1a4"/>
    <use href="#leaf" transform="translate(373 376) rotate(216) scale(1.4)" fill="#6f9a6a"/>
    <use href="#leaf" transform="translate(377 350) rotate(-52) scale(1.35)" fill="#8fb88a"/>
    <use href="#leaf" transform="translate(375 326) rotate(-92) scale(1.1)" fill="#b0d1a4"/>
