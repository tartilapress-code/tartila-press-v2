  <!-- Penerbit -->
  <text x="370" y="1000" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="9" fill="#f5f0e4" opacity="0.85">TARTILA PRESS</text>
</svg>
