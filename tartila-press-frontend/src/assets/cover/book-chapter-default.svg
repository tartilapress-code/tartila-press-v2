    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#e4dcc7"/>
    </linearGradient>
    <path id="leaf" d="M0 0C8-10 26-11 40 0C26 11 8 10 0 0Z"/>
  </defs>

  <!-- Latar -->
  <rect width="740" height="1050" fill="url(#bg)"/>
