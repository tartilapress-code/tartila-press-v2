    <circle cx="500" cy="300" r="3" opacity="0.5"/>
    <circle cx="560" cy="350" r="4.5" opacity="0.55"/>
    <circle cx="190" cy="392" r="3" opacity="0.45"/>
    <circle cx="300" cy="278" r="2.5" opacity="0.5"/>
