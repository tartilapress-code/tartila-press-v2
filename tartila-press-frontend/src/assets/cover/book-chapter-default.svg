  <text x="370" y="800" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="10" fill="#f5f0e4">BOOK</text>
  <text x="370" y="888" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="10" fill="#f5f0e4">CHAPTER</text>
