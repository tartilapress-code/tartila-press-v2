<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1050" viewBox="0 0 740 1050" role="img" aria-label="Sampul Book Chapter Tartila Press">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#0d4f7c"/>
      <stop offset="0.55" stop-color="#03304f"/>
      <stop offset="1" stop-color="#011a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b0d1a4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#b0d1a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#e4dcc7"/>
