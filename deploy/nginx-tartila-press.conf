# Nginx untuk Tartila Press. SATU domain melayani:
#
#   /          -> frontend React (hasil `vite build`: tartila-press-frontend/dist)
#   /api/      -> backend Laravel (API + halaman katalog/abstrak Google Scholar)
#   /storage/  -> unggahan (cover, foto, PDF preview) milik backend
#
# Cara pasang: lihat deploy/DEPLOY.md bagian "PHP-FPM dan Nginx". Ganti dulu
# __DOMAIN__ (mis. tartilapress.com) dan __PHPVER__ (mis. 8.3) -- perintah
# `sed` di panduan melakukannya otomatis. Setelah itu jalankan certbot: ia
# menambahkan blok HTTPS (port 443) dan pengalihan http -> https sendiri.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    server_tokens off;

    root /var/www/tartila-press-v2/tartila-press-frontend/dist;
    index index.html;

    # PDF preview sampai 20 MB, dokumen sampai 10 MB.
    client_max_body_size 30M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Berkas tersembunyi (.env, .git, dst.) tidak pernah dilayani.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---------------------------------------------------------------
    # Backend Laravel
    # ---------------------------------------------------------------
    location ^~ /api/ {
        root /var/www/tartila-press-v2/tartila-press_backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        root /var/www/tartila-press-v2/tartila-press_backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHPVER__-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    # Unggahan. `public/storage` adalah tautan ke storage/app/public yang dibuat
    # oleh `php artisan storage:link`.
    location ^~ /storage/ {
        root /var/www/tartila-press-v2/tartila-press_backend/public;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(php|phtml|phar)$ {
            return 403;
        }
    }

    # ---------------------------------------------------------------
    # Frontend (React, satu halaman)
    # ---------------------------------------------------------------

    # Worker PDF.js (.mjs) HARUS bertipe JavaScript; kalau tidak, preview buku
    # (flipbook) tidak jalan. Nginx lama belum mengenal ekstensi .mjs.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Berkas hasil build bernama-hash: aman disimpan lama di browser.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Halaman utama jangan di-cache, supaya versi baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Alamat lain (mis. /buku/embedded-system) ditangani React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
