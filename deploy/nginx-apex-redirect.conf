# Mengalihkan tartilapress.com (tanpa www) ke https://www.tartilapress.com.
# Dipasang SETELAH sertifikat HTTPS terbit (certbot, DEPLOY.md bagian 6) dan setelah
# nama tanpa-www dikeluarkan dari blok utama:
#
#   sudo sed -i 's/server_name tartilapress.com www.tartilapress.com;/server_name www.tartilapress.com;/' /etc/nginx/sites-available/tartila-press-v2
#   sudo cp deploy/nginx-apex-redirect.conf /etc/nginx/sites-available/tartila-apex-redirect
#   sudo ln -sf /etc/nginx/sites-available/tartila-apex-redirect /etc/nginx/sites-enabled/tartila-apex-redirect
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti tartilapress.com / www.tartilapress.com di bawah kalau domainnya lain. Jalur
# sertifikat memakai nama sertifikat pertama yang diterbitkan certbot (`sudo certbot certificates`).

server {
    listen 80;
    listen [::]:80;
    server_name tartilapress.com;
    return 301 https://www.tartilapress.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tartilapress.com;
    ssl_certificate /etc/letsencrypt/live/tartilapress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tartilapress.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.tartilapress.com$request_uri;
}
