; Pool PHP-FPM khusus Tartila Press v2, terpisah dari pool bawaan (`www`) yang
; dipakai website lama. Dengan pool sendiri, pengaturan v2 (user, batas unggah)
; tidak mengubah perilaku website lama.
;
; Pasang: lihat deploy/DEPLOY.md bagian "PHP-FPM dan Nginx". Ganti __USER__ dan
; __GROUP__ dengan user dan grup login server (perintah `sed` di panduan
; melakukannya).

[tartila-v2]
user = __USER__
group = __GROUP__

listen = /run/php/tartila-v2.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Unggahan: PDF preview sampai 20 MB, dokumen sampai 10 MB.
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
