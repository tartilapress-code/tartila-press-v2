; Pool PHP-FPM khusus Tartila Press v2, terpisah dari pool bawaan (`www`) yang
; dipakai website lama. Dengan pool sendiri, pengaturan v2 (user, batas unggah)
; tidak mengubah perilaku website lama.
;
; Pasang: jalankan deploy/pasang-server.sh (mengisi semua tanda berawalan dan
; berakhiran garis bawah ganda di bawah sesuai profil server), atau ikuti
; deploy/DEPLOY.md bagian "PHP-FPM dan Nginx".
;
; Isi per profil (2 GB RAM / 8 GB RAM):
;   max_children  5 / 16   worker PHP paling banyak
;   start_servers 2 / 4    worker saat start
;   min_spare     1 / 4    worker menganggur paling sedikit
;   max_spare     3 / 8    worker menganggur paling banyak
;
; Aturan hitung: tiap worker memakai +-50 MB (permintaan berat seperti membuat
; PDF/DOCX bisa sampai 200 MB). max_children = (RAM yang disisakan untuk PHP) / 60 MB.

[tartila-v2]
user = __USER__
group = __GROUP__

listen = /run/php/tartila-v2.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = __MAX_CHILDREN__
pm.start_servers = __START_SERVERS__
pm.min_spare_servers = __MIN_SPARE__
pm.max_spare_servers = __MAX_SPARE__
; Mendaur ulang worker supaya kebocoran memori kecil tidak menumpuk.
pm.max_requests = 500
; Permintaan yang menggantung lebih dari 5 menit dihentikan (bukan menghabiskan worker).
request_terminate_timeout = 300s

; Unggahan: PDF preview sampai 20 MB, dokumen sampai 10 MB, dan ebook Tartila Book
; (admin) sampai 200 MB. Batas per fitur tetap dijaga validasi Laravel.
php_admin_value[upload_max_filesize] = 210M
php_admin_value[post_max_size] = 215M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
