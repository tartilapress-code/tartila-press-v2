# Nginx untuk Tartila Book (situs baca buku). Hanya melayani berkas statis hasil
# `vite build` (tartila-book-frontend/dist). API-nya TIDAK dipasang di sini: situs
# ini memanggil API Tartila Press (VITE_API_URL di tartila-book-frontend/.env.production.local,
# mis. https://tartilapress.com/api/v1) dengan token login, jadi tidak perlu cookie
# lintas-situs. Akun, buku, dan pembayaran memakai database yang sama.
#
# Dipasang sebagai /etc/nginx/sites-available/tartila-book. Ganti dulu dua tanda:
#
#   __LISTEN__       80 (alamat sebenarnya) atau 8081 (uji coba)
#   __SERVER_NAME__  mis. book.tartilapress.com
#
# Setelah dipasang di port 80, jalankan: sudo certbot --nginx -d book.tartilapress.com

server {
    listen __LISTEN__;
    listen [::]:__LISTEN__;
    server_name __SERVER_NAME__;

    server_tokens off;

    root /var/www/tartila-press-v2/tartila-book-frontend/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Worker PDF.js (.mjs) HARUS bertipe JavaScript; kalau tidak, ebook tidak terbaca.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Alamat lain (mis. /buku/3, /baca/3) ditangani React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
