; Pengaturan PHP-FPM untuk Tartila Press v2. Dipasang sebagai
; /etc/php/<versi>/fpm/conf.d/90-tartila.ini oleh deploy/pasang-server.sh
; (hanya untuk PHP-FPM; `php` di terminal / cron tidak terpengaruh).
;
; OPcache menyimpan hasil kompilasi kode PHP di memori: tanpa ini tiap permintaan
; mengompilasi ulang ratusan berkas Laravel dan 1 vCPU cepat habis.
; validate_timestamps=0 = berkas TIDAK dicek ulang tiap permintaan. Akibatnya
; setiap deploy WAJIB memuat ulang PHP-FPM (deploy/deploy.sh sudah melakukannya;
; kalau mengubah kode manual: sudo systemctl reload php8.x-fpm).

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; Mempercepat pencarian berkas (Laravel membuka banyak berkas kecil).
realpath_cache_size=4096K
realpath_cache_ttl=600

; Jangan bocorkan versi PHP di header HTTP.
expose_php=Off
