; Pengaturan MariaDB di komputer pengembangan (XAMPP, Windows) supaya perilakunya
; sama dengan server produksi (deploy/server/mariadb-2gb.cnf). Sudah diterapkan di
; C:\xampp\mysql\bin\my.ini; berkas ini hanya catatan kalau perlu mengulang di
; komputer lain. Cadangan my.ini asli: my.ini.sebelum-tartila-2026-10-17.
;
; Pada bagian [mysqld] pastikan nilai-nilai ini ada (ganti nilai lama):
;
;   max_allowed_packet=64M
;   innodb_buffer_pool_size=256M
;   character-set-server=utf8mb4
;   collation-server=utf8mb4_unicode_ci
;   sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
;
; Database dan user pengembangan (dibuat lewat `mysql -u root`):
;
;   CREATE DATABASE tartila_press_v2 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
;   CREATE DATABASE tartila_press_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
;   CREATE USER 'tartila_v2'@'127.0.0.1' IDENTIFIED BY 'dev_tartila_v2';
;   GRANT ALL ON tartila_press_v2.*   TO 'tartila_v2'@'127.0.0.1';
;   GRANT ALL ON tartila_press_test.* TO 'tartila_v2'@'127.0.0.1';
;
; .env backend lokal:
;
;   DB_CONNECTION=mysql
;   DB_HOST=127.0.0.1
;   DB_PORT=3306
;   DB_DATABASE=tartila_press_v2
;   DB_USERNAME=tartila_v2
;   DB_PASSWORD=dev_tartila_v2
;
; Menjalankan seluruh tes di MariaDB (bukan SQLite), dari folder tartila-press_backend:
;
;   $env:DB_CONNECTION="mysql"; $env:DB_HOST="127.0.0.1"; $env:DB_PORT="3306"
;   $env:DB_DATABASE="tartila_press_test"; $env:DB_USERNAME="tartila_v2"; $env:DB_PASSWORD="dev_tartila_v2"
;   php -d extension=gd vendor/bin/phpunit
